<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Racing</title>
	<style>
		body { margin: 0; overflow: hidden; background: #000; }
		canvas { display: block; touch-action: none; }
		.corner-link {
			position: absolute;
			color: #1f2430;
			font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			text-decoration: none;
			background: rgba(255,255,255,0.92);
			padding: 9px 18px;
			border-radius: 999px;
			border: 1px solid rgba(0,0,0,0.06);
			box-shadow: 0 4px 14px rgba(0,0,0,0.18);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			z-index: 20;
			transition: background 0.15s;
		}
		.corner-link:hover { background: #fff; }
		#editor-link { bottom: 12px; right: 12px; }
		#tracks-button { bottom: 12px; left: 12px; cursor: pointer; }
		#tracks-menu {
			position: absolute;
			bottom: 56px;
			left: 12px;
			min-width: 250px;
			padding: 6px;
			background: rgba(255,255,255,0.94);
			border-radius: 14px;
			border: 1px solid rgba(0,0,0,0.06);
			box-shadow: 0 10px 30px rgba(0,0,0,0.25);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			z-index: 20;
		}
		#tracks-menu[hidden] { display: none; }
		@media (max-width: 760px) { #game-nav { bottom: 60px !important; } #tracks-menu { bottom: 100px; } }
		#tracks-menu a { display: block; padding: 8px 12px; border-radius: 9px; color: #1f2430; text-decoration: none; }
		#tracks-menu a:hover { background: rgba(0,0,0,0.05); }
		#tracks-menu a.current { background: #1f2430; color: #fff; }
		#tracks-menu small { display: block; opacity: 0.6; font-size: 11.5px; margin-top: 1px; }
		#github-link { top: 12px; right: 12px; padding: 8px; line-height: 0; }
		#github-link svg { display: block; width: 20px; height: 20px; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.3"
		}
	}
	</script>
</head>
<body>
	<a id="github-link" class="corner-link" href="https://github.com/mrdoob/Starter-Kit-Racing" aria-label="View source on GitHub">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.05c-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18.92-.26 1.91-.39 2.89-.39.98 0 1.97.13 2.89.39 2.21-1.5 3.18-1.18 3.18-1.18.62 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.79.56C20.21 21.39 23.5 17.07 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
	</a>
	<a id="editor-link" class="corner-link" href="editor.html">Create new track</a>
	<a id="tracks-button" class="corner-link" role="button" aria-haspopup="true" aria-expanded="false">Tracks</a>
	<div id="tracks-menu" hidden></div>
	<script>
		const map = new URLSearchParams( location.search ).get( 'map' );
		if ( map ) {
			const link = document.getElementById( 'editor-link' );
			link.href = 'editor.html?map=' + map;
			link.textContent = 'Edit this track';
		}
	</script>
	<script type="module">
		import { PRESET_TRACKS } from './js/Tracks.js';

		const current = new URLSearchParams( location.search ).get( 'map' );
		const menu = document.getElementById( 'tracks-menu' );
		const button = document.getElementById( 'tracks-button' );

		for ( const t of PRESET_TRACKS ) {

			const a = document.createElement( 'a' );
			a.href = t.map ? 'index.html?map=' + t.map : 'index.html';
			a.innerHTML = '<span></span><small></small>';
			a.firstChild.textContent = t.name;
			a.lastChild.textContent = t.desc;
			if ( t.map === current ) a.className = 'current';
			menu.appendChild( a );

		}

		const setOpen = ( open ) => {

			menu.hidden = ! open;
			button.setAttribute( 'aria-expanded', open );

		};

		button.addEventListener( 'click', ( e ) => { e.stopPropagation(); setOpen( menu.hidden ); } );
		document.addEventListener( 'click', ( e ) => { if ( ! menu.contains( e.target ) ) setOpen( false ); } );
	</script>
	<script src="./version.js"></script>
	<nav id="game-nav" aria-label="Game navigation" style="position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:30;display:flex;gap:12px;align-items:center;font:600 13px/1.4 system-ui,-apple-system,sans-serif;padding:6px 11px;border-radius:8px;background:rgba(15,17,26,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:.55;transition:opacity .2s;white-space:nowrap" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.55">
		<span id="version-badge" title="Version" style="color:#5a6072"></span>
		<span style="color:#5a6072" aria-hidden="true">·</span>
		<a href="https://github.freaxnx01.ch/games/" style="color:#8fd8e8;text-decoration:none">More Games…</a>
		<span style="color:#5a6072" aria-hidden="true">·</span>
		<a href="https://github.com/freaxnx01/game-kit-racer" target="_blank" rel="noopener" style="color:#8fd8e8;text-decoration:none">Source</a>
		<span style="color:#5a6072" aria-hidden="true">·</span>
		<a href="https://github.com/freaxnx01/game-kit-racer/issues/new?title=%5BFeedback%5D%20game-kit-racer&labels=feedback" target="_blank" rel="noopener" style="color:#8fd8e8;text-decoration:none">Feedback</a>
	</nav>
	<script>
		// Version badge → CHANGELOG. Text comes only from window.GAME_VERSION so
		// version.js stays the single source (never hardcode the literal here).
		( function () {
			var el = document.getElementById( 'version-badge' );
			if ( ! el ) return;
			var a = document.createElement( 'a' );
			a.href = 'https://github.com/freaxnx01/game-kit-racer/blob/main/CHANGELOG.md';
			a.target = '_blank'; a.rel = 'noopener'; a.title = 'Changelog';
			a.textContent = 'v' + ( window.GAME_VERSION || '0.0.0' );
			a.style.color = 'inherit'; a.style.textDecoration = 'none';
			el.appendChild( a );
		} )();
	</script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
